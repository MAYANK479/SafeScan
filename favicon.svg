<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Squircle Blue Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Outer Squircle Rim Glow -->
    <linearGradient id="squircleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.3" />
    </linearGradient>

    <!-- Metallic Shield Chrome Border Gradient -->
    <linearGradient id="chromeRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="75%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Red Side Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b" />
      <stop offset="40%" stop-color="#ef4444" />
      <stop offset="80%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- White Side Gradient -->
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="80%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Glass Reflection Highlight -->
    <linearGradient id="glassGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Shield Shadow Filter -->
    <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 1. Background Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#squircleBorder)" stroke-width="6" />

  <!-- 2. Shield Group with Drop Shadow -->
  <g filter="url(#shieldShadow)">
    <!-- Outer Shield Metallic Rim (Chrome) -->
    <!-- Center x=256, Top y=105, Bottom y=410, Half-width=115 -->
    <path d="M 141 115 
             Q 256 100 371 115 
             Q 385 240 256 412 
             Q 127 240 141 115 Z" 
          fill="url(#chromeRim)" 
          stroke="#475569" 
          stroke-width="2" />

    <!-- Inner Shield Clip & Content -->
    <!-- Inset by 12px -->
    <g>
      <clipPath id="innerShieldClip">
        <path d="M 153 125 
                 Q 256 112 359 125 
                 Q 372 236 256 396 
                 Q 140 236 153 125 Z" />
      </clipPath>

      <g clip-path="url(#innerShieldClip)">
        <!-- Full White/Silver Right Base -->
        <rect x="140" y="100" width="240" height="310" fill="url(#whiteGrad)" />

        <!-- Red Left Side with Sawtooth / Zigzag Center Boundary -->
        <!-- Zigzag teeth down center: (256, 115) -> (280, 155) -> (252, 195) -> (280, 235) -> (252, 275) -> (280, 315) -> (256, 396) -->
        <path d="M 140 100 
                 L 256 112 
                 L 282 152 
                 L 252 192 
                 L 284 232 
                 L 252 272 
                 L 282 312 
                 L 256 396 
                 L 140 396 Z" 
              fill="url(#redGrad)" />

        <!-- Highlight along the Sawtooth Ridge -->
        <path d="M 256 112 
                 L 282 152 
                 L 252 192 
                 L 284 232 
                 L 252 272 
                 L 282 312 
                 L 256 396" 
              fill="none" 
              stroke="#ffffff" 
              stroke-width="2.5" 
              stroke-linecap="round" 
              stroke-linejoin="round" 
              opacity="0.6" />

        <!-- Diagonal Glass Gloss Overlay -->
        <path d="M 150 120 
                 L 360 120 
                 L 310 240 
                 L 150 280 Z" 
              fill="url(#glassGloss)" />

        <!-- Inner Bevel Shadow for 3D Inset Effect -->
        <path d="M 153 125 
                 Q 256 112 359 125 
                 Q 372 236 256 396 
                 Q 140 236 153 125 Z" 
              fill="none" 
              stroke="#1e293b" 
              stroke-width="4" 
              opacity="0.35" />
      </g>
    </g>

    <!-- Chrome Rim Outer Highlight Stroke -->
    <path d="M 141 115 Q 256 100 371 115" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="3" 
          opacity="0.8" />
  </g>
</svg>
